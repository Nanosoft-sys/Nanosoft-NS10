<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nanosoft NS-10 Ultra</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
</head>
<body>

<div id="desktop">
    <div class="desktop-layer">
        <div class="d-icon" onclick="openApp('pc', '💻')">
            <div class="d-visual">💻</div>
            <span>Den här datorn</span>
        </div>
    </div>

    <div id="win-pc" class="window">
        <div class="win-header">
            <div class="win-title">💻 Filutforskare</div>
            <div class="win-controls">
                <button class="win-dot dot-min" onclick="toggleMin('pc')"></button>
                <button class="win-dot dot-close" onclick="closeApp('pc')"></button>
            </div>
        </div>
        <div class="explorer-nav">
            <button class="nav-btn" onclick="goBack()">⬅ Bakåt</button>
            <div id="path-display">C:\</div>
        </div>
        <div id="explorer-view" class="explorer-grid"></div>
    </div>

    <div id="start-menu" class="win10-menu">
        <div class="menu-sidebar">
            <div class="side-top"><div class="side-icon">☰</div></div>
            <div class="side-bottom">
                <div class="side-icon">👤</div>
                <div class="side-icon">⚙️</div>
                <div class="side-icon" style="color:#ff5f56">⏻</div>
            </div>
        </div>
        <div class="menu-body">
            <div class="menu-apps">
                <div class="menu-section-title">A-Z</div>
                <div class="menu-app-item" onclick="openApp('pc', '💻')">📂 Dokument</div>
                <div class="menu-app-item">🌐 Webbläsare</div>
                <div class="menu-app-item">📟 Terminal</div>
            </div>
            <div class="menu-tiles">
                <div class="tile weather-tile">
                    <div style="font-size:1.2rem;">☀️ 22°C</div>
                    <div style="font-size:0.6rem;">Stockholm: Klart</div>
                    <div class="tile-label">Väder</div>
                </div>
                <div class="tile news-tile">
                    <div style="font-size:0.8rem; font-weight:bold;">NS-10 Live</div>
                    <div style="font-size:0.6rem;">Systemet rullar på GitHub.</div>
                    <div class="tile-label">Nyheter</div>
                </div>
            </div>
        </div>
    </div>

    <div class="taskbar">
        <div class="start-btn" onclick="toggleStart()">NS</div>
        <div id="active-apps"></div>
        <div class="tray">
            <div id="clock-time">00:00</div>
            <div id="clock-date">2026-04-05</div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
