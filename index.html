<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nanosoft NS-98</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body>

<div id="desktop">
    <div class="desktop-layer">
        <div class="d-icon" onclick="openApp('pc', '💻')">
            <div class="d-visual">💻</div>
            <span>Den här datorn</span>
        </div>
        <div class="d-icon" onclick="openApp('pc', '📂')">
            <div class="d-visual">📂</div>
            <span>Mina dokument</span>
        </div>
    </div>

    <div id="win-pc" class="window" style="left: 20px; top: 40px;">
        <div class="win-header">
            <div class="win-title">
                <span class="win-title-icon">💻</span>
                Den här datorn
            </div>
            <div class="win-controls">
                <button class="win-btn" onclick="toggleMin('pc')">_</button>
                <button class="win-btn" style="font-weight:bold" onclick="closeApp('pc')">X</button>
            </div>
        </div>
        <div class="win-menus">
            <span><u>A</u>rkiv</span> <span><u>R</u>edigera</span> <span><u>V</u>isa</span> <span><u>H</u>jälp</span>
        </div>
        <div class="explorer-nav">
            <div class="nav-address">
                <span>A<u>d</u>ress</span>
                <input type="text" id="path-display" value="C:\" readonly>
            </div>
            <button class="nav-btn-retro" onclick="goBack()">Bakåt</button>
        </div>
        <div id="explorer-view" class="explorer-grid-retro"></div>
    </div>

    <div id="start-menu" class="win98-menu">
        <div class="menu-sidebar">
            <div class="sidebar-text">Nanosoft <span>NS-98</span></div>
        </div>
        <div class="menu-list">
            <div class="menu-item" onclick="openApp('pc', '💻')">
                <span class="menu-icon">💻</span> <u>D</u>en här datorn...
            </div>
            <div class="menu-item">
                <span class="menu-icon">📂</span> <u>P</u>rogram
            </div>
            <div class="menu-item">
                <span class="menu-icon">🌐</span> <u>W</u>ebbläsare
            </div>
            <hr class="win98-hr">
            <div class="menu-item">
                <span class="menu-icon">⚙️</span> <u>I</u>nställningar
            </div>
            <hr class="win98-hr">
            <div class="menu-item" style="margin-top:auto">
                <span class="menu-icon">⏻</span> <u>S</u>täng av...
            </div>
        </div>
    </div>

    <div class="taskbar">
        <div id="start-btn" onclick="toggleStart()">
            <span class="start-icon">N</span> Start
        </div>
        <div id="active-apps"></div>
        <div class="tray">
            <div id="clock-time">00:00</div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
