<!DOCTYPE html> 
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nanosoft NS-10 Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
</head>
<body>

<div id="desktop">
    <div class="desktop-layer">
        <div class="d-icon" onclick="openApp('pc', '💻')">
            <div class="d-visual">💻</div>
            <span>Den här datorn</span>
        </div>
        <div class="d-icon" onclick="openApp('term', '📟')">
            <div class="d-visual">📟</div>
            <span>Terminal</span>
        </div>
    </div>

    <div id="win-pc" class="window" style="left: 50px; top: 50px;">
        <div class="win-header">
            <div class="win-title">💻 Filutforskare</div>
            <div class="win-controls">
                <button class="win-dot dot-min" onclick="toggleMin('pc')"></button>
                <button class="win-dot dot-close" onclick="closeApp('pc')"></button>
            </div>
        </div>
        <div class="explorer-nav">
            <button onclick="renderExplorer('root')">🏠 Hem</button>
            <div id="path-display">C:\</div>
        </div>
        <div id="explorer-view" class="explorer-grid"></div>
    </div>

    <div id="win-term" class="window" style="left: 100px; top: 100px; width: 600px; height: 400px;">
        <div class="win-header">
            <div class="win-title">📟 Nanosoft Terminal</div>
            <div class="win-controls">
                <button class="win-dot dot-min" onclick="toggleMin('term')"></button>
                <button class="win-dot dot-close" onclick="closeApp('term')"></button>
            </div>
        </div>
        <div class="terminal-body" id="term-body">
            <div class="term-line">Nanosoft NS-10 [Version 10.0.19044]</div>
            <div class="term-line">(c) Nanosoft Corporation. Alla rättigheter reserverade.</div>
            <br>
            <div id="term-output"></div>
            <div class="term-input-line">
                <span>C:\></span><input type="text" id="term-input" autofocus>
            </div>
        </div>
    </div>

    <div class="taskbar">
        <div class="start-btn" onclick="toggleMenu('start-menu')">NS</div>
        <div class="search-box">
            <input type="text" placeholder="Sök på Nanosoft...">
        </div>
        <div id="active-apps"></div>
        <div class="tray">
            <div id="clock-time">00:00</div>
            <div id="clock-date">2026-04-04</div>
        </div>
    </div>

    <div id="start-menu" class="popup">
        <div class="start-header">👤 Användare</div>
        <div class="start-list">
            <div class="start-item" onclick="openApp('pc', '💻')">📂 Dokument</div>
            <div class="start-item">⚙️ Inställningar</div>
            <div class="start-item" style="color: #ff5f56;">🔒 Logga ut</div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
